# Kafka Configuration
kafka:
  bootstrap_servers: "localhost:9092"
  topic: "my-topic"
  consumer_group: "spark-consumer-group"
  # Optional security config
  # security.protocol: "SASL_SSL"
  # sasl.mechanism: "PLAIN"
  # sasl.username: "user"
  # sasl.password: "password"
  # starting_offsets: "latest" # or "earliest"

# Schema Registry Configuration
schema_registry:
  url: "http://localhost:8081"
  # Optional basic auth
  # basic.auth.user.info: "user:password"
  type: "AVRO" # AVRO, JSON, or PROTOBUF

# Spark Configuration
spark:
  app_name: "KafkaSparkPipeline"
  streaming: true # Set to false for batch mode
  # Optional extra spark configs
  config:
    "spark.sql.shuffle.partitions": "2"

# Output Configuration
output:
  format: "console" # delta, parquet, json, console, etc.
  mode: "append" # append, complete, update
  checkpoint_location: "/tmp/checkpoint"
  # Optional writer options
  options:
    truncate: "false"
